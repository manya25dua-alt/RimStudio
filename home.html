<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RIMSTUDIO — Choose Your Canvas</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Michroma&display=swap">
  <style>
    :root {
      --ob: #07090c;
      --ch: #10141a;
      --gr: #1c2128;
      --si: #9ba5b2;
      --wh: #f0f2f5;
      --bl: #4fa3ff;
      --bl2: #1a6fff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--ob);
      color: var(--wh);
      font: 500 13px/1.45 Manrope, system-ui, sans-serif;
      overflow: hidden;
    }

    /* ── Intro splash ─────────────────────────────── */
    #intro {
      position: fixed; inset: 0;
      background: var(--ob);
      z-index: 40;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 16px;
      transition: clip-path .9s cubic-bezier(.7,0,.2,1) .1s, opacity .35s .85s;
      clip-path: inset(0);
    }
    #intro b {
      font: 400 22px Michroma, sans-serif;
      letter-spacing: .5em;
      animation: track 1.6s cubic-bezier(.2,.8,.2,1) both;
    }
    #intro i {
      display: block;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--bl), transparent);
      animation: ln 1.6s ease both;
    }
    @keyframes track { from { letter-spacing: -.05em; opacity: 0; filter: blur(12px); } }
    @keyframes ln    { from { width: 0; } to { width: 260px; } }
    #intro.out { clip-path: inset(0 0 100% 0); opacity: 0; pointer-events: none; }

    /* ── Root layout ──────────────────────────────── */
    #app {
      height: 100%;
      display: grid;
      grid-template-rows: 52px 1fr;
      animation: fade 1s .8s both;
    }
    @keyframes fade { from { opacity: 0; } }

    /* ── Top bar ──────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 0 24px;
      border-bottom: 1px solid #ffffff10;
      background: linear-gradient(#0d1117, #07090c);
      position: relative;
      z-index: 10;
    }
    .logo {
      font: 400 14px Michroma, sans-serif;
      letter-spacing: .3em;
      background: linear-gradient(100deg, #fff 35%, var(--bl) 50%, #fff 65%) 0 0/250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }
    @keyframes shine { to { background-position: -250% 0; } }
    .tag {
      font-size: 10px;
      letter-spacing: .3em;
      color: var(--si);
      opacity: .5;
      white-space: nowrap;
    }
    .hbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mode-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid #ffffff18;
      background: #ffffff08;
      font-size: 10px;
      letter-spacing: .18em;
      color: var(--si);
    }
    .mode-pill .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #3cff8a;
      box-shadow: 0 0 8px #3cff8a;
    }
    .hbtn {
      background: none;
      border: 1px solid #ffffff18;
      border-radius: 6px;
      padding: 5px 14px;
      font: 500 10px/1 Manrope, sans-serif;
      letter-spacing: .18em;
      color: var(--si);
      cursor: pointer;
      transition: .3s;
    }
    .hbtn:hover { border-color: var(--bl); color: #fff; }
    .hbtn.active { border-color: var(--bl); color: var(--bl); background: #4fa3ff11; }
    .drag-hint {
      font-size: 10px;
      letter-spacing: .18em;
      color: var(--si);
      opacity: .45;
    }

    /* ── Main split ───────────────────────────────── */
    main {
      display: grid;
      grid-template-columns: 310px 1fr;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Left panel ───────────────────────────────── */
    .panel {
      background: linear-gradient(170deg, #0e1219f5, #08090df5);
      border-right: 1px solid #ffffff10;
      display: flex;
      flex-direction: column;
      padding: 28px 20px 24px;
      gap: 24px;
      overflow: hidden;
      animation: slideIn 1s 1s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes slideIn { from { transform: translateX(-40px); opacity: 0; } }
    .panel-step {
      font: 400 10px Michroma, sans-serif;
      letter-spacing: .22em;
      color: var(--si);
      opacity: .5;
      display: flex;
      justify-content: space-between;
    }
    .panel-title {
      font: 700 28px/1.15 Manrope, sans-serif;
      color: #fff;
    }
    .panel-title span {
      display: block;
      color: var(--bl);
    }

    /* Car list */
    .car-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow: auto;
    }
    .car-list::-webkit-scrollbar { width: 3px; }
    .car-list::-webkit-scrollbar-track { background: transparent; }
    .car-list::-webkit-scrollbar-thumb { background: #ffffff18; border-radius: 3px; }

    .car-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: .35s cubic-bezier(.2,.8,.2,1);
      background: transparent;
      color: inherit;
      text-align: left;
      width: 100%;
    }
    .car-item:hover {
      background: #ffffff08;
      border-color: #ffffff15;
    }
    .car-item.on {
      background: #4fa3ff10;
      border-color: var(--bl);
      box-shadow: 0 0 20px #4fa3ff22;
    }
    .car-item .num {
      font: 400 11px Michroma, sans-serif;
      letter-spacing: .1em;
      color: var(--si);
      opacity: .5;
      min-width: 22px;
      transition: .3s;
    }
    .car-item.on .num { opacity: 1; color: var(--bl); }
    .car-item .thumb {
      width: 90px;
      height: 52px;
      border-radius: 7px;
      overflow: hidden;
      background: #0c0f14;
      border: 1px solid #ffffff12;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .car-item .thumb svg {
      width: 100%;
      height: 100%;
    }
    .car-item .info { flex: 1; min-width: 0; }
    .car-item .make {
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .car-item .model {
      font-size: 11px;
      color: var(--si);
      opacity: .65;
      margin-top: 2px;
    }
    .car-item .sel-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--bl);
      box-shadow: 0 0 8px var(--bl);
      opacity: 0;
      transition: .3s;
      flex: none;
    }
    .car-item.on .sel-dot { opacity: 1; }

    /* Customize CTA */
    .cta {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--bl2), var(--bl));
      border: none;
      color: #fff;
      font: 700 12px/1 Manrope, sans-serif;
      letter-spacing: .18em;
      cursor: pointer;
      transition: .3s cubic-bezier(.2,.8,.2,1);
      box-shadow: 0 4px 24px #4fa3ff44;
      text-align: center;
      text-decoration: none;
    }
    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px #4fa3ff66;
    }
    .cta:active { transform: scale(.97); }

    /* ── Right stage ──────────────────────────────── */
    .stage {
      position: relative;
      overflow: hidden;
    }

    /* Environment background */
    .env-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    /* Sky gradient */
    .env-sky {
      position: absolute;
      inset: 0;
      background: linear-gradient(175deg, #d4e8f0 0%, #b8d4e8 18%, #8ab4cc 35%, #5a8aaa 50%, #2a5070 65%, #1a3550 80%, #0e2035 100%);
    }
    /* Overcast cloud overlay */
    .env-clouds {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 140% 40% at 50% 10%, #e8eef2cc 0%, transparent 60%),
        radial-gradient(ellipse 80% 25% at 20% 5%, #dce8f0aa 0%, transparent 50%),
        radial-gradient(ellipse 60% 20% at 80% 8%, #d8e8f0aa 0%, transparent 50%);
    }
    /* Ground / road */
    .env-ground {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      height: 42%;
      background: linear-gradient(180deg, #5a6a70 0%, #48555a 20%, #3a454a 45%, #2a3338 70%, #1a2228 100%);
    }
    /* Road surface */
    .env-road {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      height: 35%;
      background: linear-gradient(180deg, #4a5560 0%, #38444c 30%, #2a3540 60%, #1e2c38 100%);
      clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
    }
    /* Road lines */
    .env-road::after {
      content: '';
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 60%;
      background: repeating-linear-gradient(180deg, #ffffff55 0 16px, transparent 16px 32px);
    }
    /* Background building / structure */
    .env-structure {
      position: absolute;
      right: 8%;
      bottom: 38%;
      width: 18%;
      height: 32%;
      background: linear-gradient(180deg, #c8d0d8 0%, #a8b4be 40%, #889098 100%);
      border-radius: 2px 2px 0 0;
    }
    .env-structure::before {
      content: '';
      position: absolute;
      bottom: 100%;
      left: -8%;
      right: -8%;
      height: 12%;
      background: #b0bcc4;
      border-radius: 2px 2px 0 0;
    }
    .env-structure::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg, transparent 0 28%, #00000012 28% 30%, transparent 30% 58%, #00000012 58% 60%, transparent 60%);
    }
    /* Trees / foliage silhouette */
    .env-trees {
      position: absolute;
      left: 0;
      bottom: 36%;
      width: 38%;
      height: 26%;
      background:
        radial-gradient(ellipse 20% 50% at 8% 80%, #4a6a40cc 0%, transparent 70%),
        radial-gradient(ellipse 22% 60% at 18% 75%, #3e5e36cc 0%, transparent 70%),
        radial-gradient(ellipse 18% 55% at 28% 78%, #567844cc 0%, transparent 70%),
        radial-gradient(ellipse 24% 65% at 38% 72%, #405e38cc 0%, transparent 70%);
    }
    /* Horizon haze */
    .env-haze {
      position: absolute;
      bottom: 38%;
      left: 0; right: 0;
      height: 10%;
      background: linear-gradient(180deg, transparent 0%, #8aaan8 40%, #ccdde8aa 70%, transparent 100%);
      filter: blur(8px);
    }
    /* Vignette */
    .env-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, transparent 40%, #000000aa 100%);
      z-index: 1;
    }

    /* Car viewport */
    .car-view {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 4%;
    }
    .car-view svg {
      width: 78%;
      max-width: 860px;
      height: auto;
      filter: drop-shadow(0 20px 60px #000c);
      animation: carSlide 1.2s 1.5s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes carSlide { from { transform: translateX(-80px); opacity: 0; } }

    /* Shadow under car */
    .car-shadow {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      width: 54%;
      height: 3.5%;
      background: radial-gradient(ellipse, #00000099 0%, transparent 70%);
      z-index: 2;
      filter: blur(6px);
    }

    /* Bottom info bar */
    .info-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 5;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 20px 28px;
      background: linear-gradient(transparent, #00000088);
    }
    .info-left .current-cfg {
      font: 400 9px Michroma, sans-serif;
      letter-spacing: .22em;
      color: var(--si);
      opacity: .55;
      margin-bottom: 5px;
    }
    .info-left .car-name {
      font: 700 22px/1.1 Manrope, sans-serif;
      color: #fff;
    }
    .info-left .car-name span {
      font-weight: 400;
      color: var(--si);
    }
    .info-left .sub {
      font-size: 11px;
      letter-spacing: .12em;
      color: var(--si);
      opacity: .65;
      margin-top: 4px;
    }
    .info-right {
      display: flex;
      align-items: flex-end;
      gap: 20px;
    }
    .wheel-card {
      padding: 14px 18px;
      border-radius: 12px;
      background: #0d1015aa;
      backdrop-filter: blur(18px);
      border: 1px solid #ffffff18;
      min-width: 180px;
    }
    .wheel-card .wc-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .wheel-card .wc-num {
      font: 400 10px Michroma, sans-serif;
      letter-spacing: .18em;
      color: var(--si);
      opacity: .5;
    }
    .wheel-card .wc-from {
      font-size: 10px;
      color: var(--si);
      opacity: .6;
    }
    .wheel-card .wc-label {
      font: 400 9px Michroma, sans-serif;
      letter-spacing: .2em;
      color: var(--bl);
      margin-bottom: 4px;
    }
    .wheel-card .wc-name {
      font: 700 16px Manrope, sans-serif;
      color: #fff;
      margin-bottom: 4px;
    }
    .wheel-card .wc-sub {
      font-size: 10px;
      letter-spacing: .1em;
      color: var(--si);
      opacity: .6;
    }

    /* Drag hint top right */
    .drag-top {
      position: absolute;
      top: 16px;
      right: 20px;
      z-index: 5;
      font: 400 10px Michroma, sans-serif;
      letter-spacing: .2em;
      color: var(--si);
      opacity: .45;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .drag-top::before {
      content: '';
      display: block;
      width: 28px;
      height: 1px;
      background: currentColor;
    }

    /* Responsive */
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .panel {
        flex-direction: row;
        flex-wrap: wrap;
        padding: 14px 16px;
        gap: 12px;
        border-right: 0;
        border-bottom: 1px solid #ffffff10;
      }
      .panel-title { font-size: 20px; }
      .car-list { flex-direction: row; overflow: auto; flex: none; width: 100%; }
      .car-item { min-width: 130px; }
    }
  </style>
</head>
<body>

  <!-- Intro splash -->
  <div id="intro"><b>RIMSTUDIO</b><i></i></div>

  <div id="app">

    <!-- Top header -->
    <header>
      <div class="logo">RIMSTUDIO</div>
      <div class="tag">PERSONALIZE YOUR DRIVE</div>
      <div class="hbar-right">
        <div class="mode-pill"><span class="dot"></span>STUDIO MODE</div>
        <button class="hbtn active">LIVE PREVIEW</button>
        <span class="drag-hint">DRAG TO EXPLORE →</span>
      </div>
    </header>

    <main>

      <!-- ── Left panel ── -->
      <div class="panel">
        <div class="panel-step">
          <span>01 / VEHICLE</span>
          <span id="stepCount">01–05</span>
        </div>
        <div class="panel-title">Choose your<span>canvas.</span></div>

        <div class="car-list" id="carList"></div>

        <a href="index.html" class="cta" id="ctaBtn">CUSTOMIZE WHEELS →</a>
      </div>

      <!-- ── Right stage ── -->
      <div class="stage" id="stage">

        <!-- Environment background -->
        <div class="env-bg">
          <div class="env-sky"></div>
          <div class="env-clouds"></div>
          <!-- Trees silhouette -->
          <div class="env-trees"></div>
          <!-- Structure on right -->
          <div class="env-structure"></div>
          <!-- Haze at horizon -->
          <div class="env-haze"></div>
          <!-- Ground -->
          <div class="env-ground"></div>
          <div class="env-road"></div>
          <!-- Vignette -->
          <div class="env-vignette"></div>
        </div>

        <!-- Car SVG viewport -->
        <div class="car-view" id="carView">
          <svg id="carSvg" viewBox="40 140 740 210" preserveAspectRatio="xMidYMax meet">
            <defs>
              <linearGradient id="hp_paint" gradientUnits="userSpaceOnUse" x1="0" y1="146" x2="0" y2="272">
                <stop id="hp_p0" offset="0"/>
                <stop id="hp_p1" offset=".6"/>
                <stop offset="1" stop-color="#050709"/>
              </linearGradient>
              <linearGradient id="hp_gl2" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#3a4b60"/>
                <stop offset="1" stop-color="#070b10"/>
              </linearGradient>
              <linearGradient id="hp_shg">
                <stop offset="0" stop-color="#fff" stop-opacity="0"/>
                <stop offset=".5" stop-color="#fff" stop-opacity=".38"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
              <radialGradient id="hp_fin0" gradientUnits="userSpaceOnUse" cx="-14" cy="-16" r="70">
                <stop offset="0" stop-color="#59606b"/>
                <stop offset=".55" stop-color="#15171b"/>
                <stop offset="1" stop-color="#040506"/>
              </radialGradient>
              <filter id="hp_bl4"><feGaussianBlur stdDeviation="6"/></filter>
              <filter id="hp_bl2"><feGaussianBlur stdDeviation="2"/></filter>
              <clipPath id="hp_bc"><path id="hp_bcp"/></clipPath>
              <clipPath id="hp_ac"><rect x="0" y="0" width="800" height="272"/></clipPath>
            </defs>

            <!-- Car body -->
            <path id="hp_body" fill="url(#hp_paint)"/>

            <!-- Shine -->
            <g clip-path="url(#hp_bc)">
              <rect id="hp_shn" y="100" width="110" height="200" fill="url(#hp_shg)" transform="skewX(-22)"/>
            </g>

            <!-- Glass -->
            <path id="hp_glass" fill="url(#hp_gl2)"/>
            <path id="hp_gh" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>

            <!-- Door line -->
            <path d="M92 243 L735 245" stroke="#fff" stroke-opacity=".12" stroke-width="1.2"/>

            <!-- Wheel arches -->
            <g clip-path="url(#hp_ac)">
              <circle cx="215" cy="270" r="66" fill="#050709"/>
              <circle cx="595" cy="270" r="66" fill="#050709"/>
            </g>

            <!-- Wheels -->
            <g id="hp_wl">
              <g transform="translate(215 270)" id="hp_w1"></g>
              <g transform="translate(595 270)" id="hp_w2"></g>
            </g>

            <!-- Headlight -->
            <path class="hp_hl" d="M688 226 L742 231 L736 240 L694 237Z" fill="#fff"/>
            <path class="hp_hl" d="M688 226 L742 231 L736 240 L694 237Z" fill="#cfe8ff" filter="url(#hp_bl4)"/>
            <!-- Tail light -->
            <path d="M70 236 L96 231 L97 243 L70 247Z" fill="#ff2b3a" class="hp_hl"/>
            <!-- Shadow under car -->
            <ellipse cx="400" cy="330" rx="280" ry="10" fill="#000" opacity=".55" filter="url(#hp_bl4)"/>
          </svg>
        </div>

        <!-- Drag hint -->
        <div class="drag-top">DRAG TO EXPLORE</div>

        <!-- Bottom info overlay -->
        <div class="info-bar">
          <div class="info-left">
            <div class="current-cfg">CURRENT CONFIGURATION</div>
            <div class="car-name"><span id="ib_make"></span> <span id="ib_model" style="color:#fff;font-weight:700"></span></div>
            <div class="sub" id="ib_sub"></div>
          </div>
          <div class="info-right">
            <div class="wheel-card">
              <div class="wc-top">
                <span class="wc-num">01</span>
                <span class="wc-from">SELECTED WHEEL</span>
              </div>
              <div class="wc-label">ATLAS</div>
              <div class="wc-name" id="wc_name">Multi-Spoke</div>
              <div class="wc-sub" id="wc_sub">MULTI-SPOKE / GLOSS BLACK</div>
            </div>
          </div>
        </div>

      </div><!-- /stage -->
    </main>
  </div>

  <script>
    // ── Car data (mirrors script.js) ────────────────────────────────────────
    const CARS = [
      {
        make: 'BMW', model: 'M4 Competition',
        n: 'BMW M4',
        c: ['#3a78ff', '#0b2a7a'],
        b: 'M70 262C68 240 84 228 130 222L250 208C285 176 335 152 410 148L500 150C560 154 615 188 655 204L720 214C748 220 756 240 752 262Z',
        g: 'M285 204C312 178 350 162 410 160L495 162C535 166 575 186 610 204Z',
        sz: [19, 20, 21], def: { d: 'multi', f: 0, s: 19 }
      },
      {
        make: 'Mercedes-Benz', model: 'S-Class',
        n: 'Mercedes-Benz S-Class',
        c: ['#c4ccd6', '#4b535d'],
        b: 'M50 262C48 238 64 226 100 222L220 214C250 186 300 168 380 164L520 164C575 168 620 190 668 208L728 218C756 224 762 242 758 262Z',
        g: 'M255 212C285 190 320 178 380 176L525 176C565 180 600 196 636 210Z',
        sz: [19, 20, 21], def: { d: 'five', f: 2, s: 19 }
      },
      {
        make: 'Porsche', model: '911 Carrera',
        n: 'Porsche 911',
        c: ['#e0343a', '#6a0b12'],
        b: 'M85 262C80 238 96 226 140 220L230 206C270 170 330 150 400 150C470 150 540 168 590 198L690 212C735 218 748 238 744 262Z',
        g: 'M265 204C300 176 345 162 400 162C455 162 510 176 560 200Z',
        sz: [19, 20, 21], def: { d: 'split', f: 2, s: 20 }
      },
      {
        make: 'Audi', model: 'RS 7 Sportback',
        n: 'Audi RS7',
        c: ['#9aa1aa', '#2f3338'],
        b: 'M60 262C58 238 76 226 115 222L240 210C290 174 350 156 430 154C510 154 575 176 640 204L722 214C752 220 758 240 754 262Z',
        g: 'M275 208C320 180 370 168 430 167C500 167 560 186 612 206Z',
        sz: [20, 21], def: { d: 'mesh', f: 1, s: 20 }
      },
      {
        make: 'Ford', model: 'Mustang GT',
        n: 'Ford Mustang GT',
        c: ['#ff8a2a', '#8a3500'],
        b: 'M70 262C66 236 84 224 120 220L225 212C255 178 300 160 360 158L450 160C510 166 560 192 600 208L728 216C752 222 758 242 754 262Z',
        g: 'M262 210C288 184 322 172 362 171L445 173C490 178 530 194 560 208Z',
        sz: [18, 19, 20], def: { d: 'five', f: 0, s: 19 }
      }
    ];

    // ── Wheel shape helpers ─────────────────────────────────────────────────
    const spk = (a, r0, r1, w0, w1) => {
      const c = Math.cos(a), s = Math.sin(a), f = n => n.toFixed(1);
      return `<polygon points="${f(r0*c-w0*s)},${f(r0*s+w0*c)} ${f(r1*c-w1*s)},${f(r1*s+w1*c)} ${f(r1*c+w1*s)},${f(r1*s-w1*c)} ${f(r0*c+w0*s)},${f(r0*s-w0*c)}"/>`;
    };
    const N = (n, fn) => Array.from({length:n},(_,i)=>fn(i)).join('');
    const SP = {
      multi:  R => N(10, i => spk(i*Math.PI/5, R*.2, R*.93, R*.045, R*.06)),
      five:   R => N(5,  i => spk(i*1.2566,    R*.2, R*.93, R*.13,  R*.2)),
      split:  R => N(5,  i => spk(i*1.2566-.1, R*.2, R*.93, R*.04,  R*.05)+spk(i*1.2566+.1, R*.2, R*.93, R*.04, R*.05)),
      mesh:   R => `<g fill="none" stroke="inherit" stroke-width="${R*.05}">${[.35,.55,.75,.9].map(k=>`<circle r="${R*k}"/>`).join('')}${N(16,i=>{const a=i*Math.PI/8;return`<path d="M0 0L${Math.cos(a)*R*.93} ${Math.sin(a)*R*.93}"/>`;})}</g>`,
      turbine:R => `<g fill="none" stroke="inherit" stroke-width="${R*.085}" stroke-linecap="round">${N(12,i=>{const a=i*Math.PI/6,p=(t,r)=>`${Math.cos(t)*r*R} ${Math.sin(t)*r*R}`;return`<path d="M${p(a,.22)}Q${p(a+.25,.6)} ${p(a+.7,.9)}"/>`;})}</g>`,
      aero:   R => `<circle r="${R*.93}"/><g fill="#06080a" opacity=".9">${N(8,i=>spk(i*Math.PI/4+.4,R*.5,R*.82,R*.05,R*.07))}</g>`
    };
    const FIN_NAMES = ['Gloss Black','Matte Black','Metallic Silver','Bronze','Chrome'];

    function wheelM(s, d, f) {
      const R = 34 + (s - 18) * 4;
      const u = 'url(#hp_fin0)';
      return `
        <circle r="58" fill="#08090b"/>
        <circle r="57" fill="none" stroke="#22272e" stroke-width="1.5"/>
        <circle r="${R}" fill="${u}"/>
        <circle r="${R*.94}" fill="#04060a"/>
        <circle r="${R*.82}" fill="#181d22" stroke="#252c33"/>
        <path d="M${R*.3} ${-R*.78}A${R*.8} ${R*.8} 0 0 1 ${R*.8} ${-R*.3}" fill="none" stroke="#4fa3ff" stroke-width="${R*.16}" stroke-linecap="round"/>
        <g fill="${u}" stroke="${u}" transform="rotate(${Math.random()*360|0})">${SP[d](R)}<circle r="${R*.2}"/><circle r="${R*.08}" fill="#07090b" stroke="none"/></g>
      `;
    }

    // ── State ───────────────────────────────────────────────────────────────
    let sel = 0;

    // ── Build car list ──────────────────────────────────────────────────────
    const list = document.getElementById('carList');
    CARS.forEach((car, i) => {
      const btn = document.createElement('button');
      btn.className = 'car-item' + (i === 0 ? ' on' : '');
      btn.innerHTML = `
        <span class="num">0${i+1}</span>
        <span class="thumb">
          <svg viewBox="40 140 730 160">
            <path d="${car.b}" fill="${car.c[0]}"/>
            <path d="${car.g}" fill="#0b1118"/>
            <circle cx="215" cy="270" r="48" fill="#0a0b0d"/>
            <circle cx="595" cy="270" r="48" fill="#0a0b0d"/>
            <circle cx="215" cy="270" r="28" fill="#2a2f38"/>
            <circle cx="595" cy="270" r="28" fill="#2a2f38"/>
          </svg>
        </span>
        <span class="info">
          <span class="make">${car.make}</span>
          <span class="model">${car.model}</span>
        </span>
        <span class="sel-dot"></span>
      `;
      btn.addEventListener('click', () => selectCar(i));
      list.appendChild(btn);
    });

    // ── Paint main car view ─────────────────────────────────────────────────
    function paintCar(i) {
      const car = CARS[i];
      document.getElementById('hp_body').setAttribute('d', car.b);
      document.getElementById('hp_bcp') && document.getElementById('hp_bcp').setAttribute('d', car.b);
      document.getElementById('hp_glass').setAttribute('d', car.g);
      document.getElementById('hp_gh').setAttribute('d', car.g);
      document.getElementById('hp_p0').setAttribute('stop-color', car.c[0]);
      document.getElementById('hp_p1').setAttribute('stop-color', car.c[1]);

      // Wheels
      const wm = wheelM(car.def.s, car.def.d, car.def.f);
      document.getElementById('hp_w1').innerHTML = wm;
      document.getElementById('hp_w2').innerHTML = wm;

      // Info bar
      const parts = car.n.split(' ');
      document.getElementById('ib_make').textContent = parts[0];
      document.getElementById('ib_model').textContent = parts.slice(1).join(' ');
      document.getElementById('ib_sub').textContent =
        `ATLAS / GLOSS BLACK ${car.def.s}"`;

      // Step count label
      document.getElementById('stepCount').textContent =
        `0${i+1}–0${CARS.length}`;
    }

    function selectCar(i) {
      if (i === sel) return;
      sel = i;
      document.querySelectorAll('.car-item').forEach((el, j) =>
        el.classList.toggle('on', j === i)
      );
      // Animate the svg out/in
      const svg = document.getElementById('carSvg');
      svg.style.transition = 'opacity .25s, transform .25s';
      svg.style.opacity = '0';
      svg.style.transform = 'translateX(-40px)';
      setTimeout(() => {
        paintCar(i);
        svg.style.opacity = '1';
        svg.style.transform = 'translateX(0)';
      }, 260);
    }

    // ── Parallax on mouse move ──────────────────────────────────────────────
    const stage = document.getElementById('stage');
    let tx = 0, ty = 0, cx_ = 0, cy_ = 0;
    stage.addEventListener('pointermove', e => {
      const r = stage.getBoundingClientRect();
      tx = ((e.clientX - r.left) / r.width  - .5) * 2;
      ty = ((e.clientY - r.top)  / r.height - .5) * 2;
    });
    stage.addEventListener('pointerleave', () => { tx = 0; ty = 0; });
    (function loop() {
      cx_ += (tx - cx_) * .05;
      cy_ += (ty - cy_) * .05;
      const svg = document.getElementById('carSvg');
      svg.style.transform = `translate(${cx_*12}px,${cy_*6}px)`;
      requestAnimationFrame(loop);
    })();

    // ── Initial paint ────────────────────────────────────────────────────────
    paintCar(0);

    // ── Intro dismiss ────────────────────────────────────────────────────────
    setTimeout(() => document.getElementById('intro').classList.add('out'), 1600);
  </script>
</body>
</html>
