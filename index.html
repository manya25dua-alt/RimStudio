<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>RIMSTUDIO</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Michroma&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="photo.css">
</head>
<body>
  <div id="intro"><b>RIMSTUDIO</b><i></i></div>

  <div id="app">
    <header>
      <div class="logo">RIMSTUDIO</div>
      <div class="tag">PERSONALIZE YOUR DRIVE</div>
      <div class="cn" id="cn"></div>

      <button class="ib" id="fav" aria-label="Save configuration" title="Save configuration">
        <svg class="h" viewBox="0 0 24 24">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>
        </svg>
      </button>

      <button class="ib" id="rst" aria-label="Reset configuration" title="Reset to original wheels">
        <svg viewBox="0 0 24 24">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>
        </svg>
      </button>
    </header>

    <main>
      <aside>
        <div class="lab">WHEEL CATEGORY</div>
        <div class="tabs" id="tabs">
          <i></i>
          <button data-c="all" class="on">All</button>
          <button data-c="Alloy">Alloy</button>
          <button data-c="Sport">Sport</button>
          <button data-c="Luxury">Luxury</button>
        </div>

        <div class="lab">WHEEL DESIGN</div>
        <div class="grid" id="grid"></div>

        <div class="lab">FINISH <b id="fnm"></b></div>
        <div class="sw" id="sw"></div>

        <div class="lab">SIZE</div>
        <div class="sz" id="sz"></div>
      </aside>

      <section class="stage" id="stage">
        <!-- Brick wall background photo (parallax layer) -->
        <div class="layer bgimg" id="bm"></div>
        <div class="layer bgimg" id="bm2"></div>

        <canvas id="cv"></canvas>
        <div class="glow" id="gl"></div>

        <div class="cam" id="cam">
          <svg id="sv" viewBox="0 100 800 330" preserveAspectRatio="xMidYMax meet">
            <defs id="df">
              <linearGradient id="paint" gradientUnits="userSpaceOnUse" x1="0" y1="146" x2="0" y2="272">
                <stop id="p0" offset="0"/>
                <stop id="p1" offset=".6"/>
                <stop offset="1" stop-color="#04060a"/>
              </linearGradient>
              <linearGradient id="gl2" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#3a4b60"/>
                <stop offset="1" stop-color="#070b10"/>
              </linearGradient>
              <linearGradient id="shg">
                <stop offset="0" stop-color="#fff" stop-opacity="0"/>
                <stop offset=".5" stop-color="#fff" stop-opacity=".38"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="rf" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity=".4"/>
                <stop offset=".7" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
            </defs>

            <mask id="rm" maskUnits="userSpaceOnUse" x="0" y="328" width="800" height="110">
              <rect x="0" y="328" width="800" height="110" fill="url(#rf)"/>
            </mask>

            <clipPath id="bc"><path id="bcp"/></clipPath>
            <clipPath id="ac"><rect x="0" y="0" width="800" height="272"/></clipPath>

            <filter id="bl4"><feGaussianBlur stdDeviation="7"/></filter>
            <filter id="bl1"><feGaussianBlur stdDeviation="1.4"/></filter>

            <!-- Reflection on the floor -->
            <g mask="url(#rm)" filter="url(#bl1)">
              <use href="#carG" transform="translate(0 656) scale(1 -1)"/>
            </g>

            <!-- Contact shadow -->
            <g id="carG">
              <ellipse cx="400" cy="331" rx="310" ry="13" fill="#000" opacity=".85" filter="url(#bl4)"/>
            </g>

            <!-- Everything that drives in with the car -->
            <g id="carBody">

              <!-- Fallback: drawn car, only shown if the photo is missing -->
              <g id="vec">
                <path id="body" fill="url(#paint)"/>
                <g clip-path="url(#bc)">
                  <rect id="shn" y="100" width="110" height="200" fill="url(#shg)" transform="skewX(-22)"/>
                </g>
                <path id="glass" fill="url(#gl2)"/>
                <path id="gh" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
                <path d="M92 243 L735 245" stroke="#fff" stroke-opacity=".14" stroke-width="1.4"/>
                <g clip-path="url(#ac)">
                  <circle cx="215" cy="270" r="66" fill="#04060a"/>
                  <circle cx="595" cy="270" r="66" fill="#04060a"/>
                </g>
                <path class="hl" d="M688 226 L742 231 L736 240 L694 237Z" fill="#fff"/>
                <path class="hl" d="M688 226 L742 231 L736 240 L694 237Z" fill="#cfe8ff" filter="url(#bl4)"/>
                <path d="M70 236 L96 231 L97 243 L70 247Z" fill="#ff2b3a" class="hl"/>
              </g>

              <!-- Real car photo (cut-out PNG, set by script.js) -->
              <image id="photo" x="0" y="100" width="800" height="220" preserveAspectRatio="xMidYMid meet"/>


              <!-- Wheels (positioned and scaled per car in script.js) -->
              <g id="wl">
                <g transform="translate(215 270)" class="wi"></g>
                <g transform="translate(595 270)" class="wi"></g>
              </g>
            </g>
          </svg>
        </div>

        <div class="vig"></div>
        <div class="inter" id="inter"><div class="ii" id="ii"></div><b>INTERIOR</b></div>
        <div class="flash" id="fs"></div>
        <div class="strip" id="strip"></div>
        <div class="chip" id="chip">FACTORY WHEELS</div>

        <div class="card">
          <h4>SELECTED WHEEL</h4>
          <div class="row"><em>DESIGN</em><b id="dd"></b></div>
          <div class="row"><em>FINISH</em><b id="df2"></b></div>
          <div class="row"><em>DIAMETER</em><b id="ds"></b></div>
          <div class="row"><em>FITMENT</em><b id="dfit" style="color:#e8c36a"></b></div>
        </div>

        <div class="bar">
          <button class="ib" id="zo" aria-label="Zoom out" title="Zoom out">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg>
          </button>
          <button class="ib" id="zi" aria-label="Zoom in" title="Zoom in">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6M11 8v6"/></svg>
          </button>
          <button class="ib" id="zr" aria-label="Reset view" title="Reset view">
            <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
          <div class="sp"></div>
          <button class="ib" id="sp" aria-label="Spin wheels" title="Spin wheels">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v5h-5"/></svg>
          </button>
          <button class="ib" id="cp" aria-label="Compare with original wheels" title="Compare with original wheels">
            <svg viewBox="0 0 24 24"><path d="M12 3v18M6 8l-4 4 4 4M18 8l4 4-4 4"/></svg>
          </button>
          <button class="ib" id="in" aria-label="Interior view" title="Interior view">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M3 12h6.5M14.5 12H21M12 14.5V21"/></svg>
          </button>
          <button class="ib" id="sv2" aria-label="Save configuration" title="Save configuration">
            <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
          </button>
        </div>

        <div class="toast" id="ts"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
